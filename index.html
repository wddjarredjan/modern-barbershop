    <style>
      /* Artistic loading overlay */
      #loading-screen{
        position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;
        background:linear-gradient(180deg,#071024 0%,#071828 55%,#07101a 100%);
        transition:opacity .7s cubic-bezier(.2,.9,.2,1),transform .7s cubic-bezier(.2,.9,.2,1);opacity:1
      }

      .loading-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}

      /* Glowing halo */
      .halo{
        position:absolute;inset:unset;width:170px;height:170px;border-radius:50%;
        background:conic-gradient(from 120deg, rgba(255,184,60,0.15), rgba(255,120,30,0.06), rgba(255,184,60,0.12));

      .logo-circle img{width:64%;height:64%;object-fit:contain;display:block;transform-origin:center;animation:logo-float 3.6s ease-in-out infinite}

      /* Soft particles around the logo */
      .dots{position:absolute;inset:0;z-index:3;pointer-events:none}
      .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#ffb83c,#ff7a00);box-shadow:0 10px 30px rgba(255,130,0,.16);opacity:.95}
      .dot.d1{left:50%;top:6%;transform:translateX(-50%)}
      .dot.d2{right:6%;top:30%}
      .dot.d3{right:6%;bottom:30%}
      .dot.d4{left:50%;bottom:6%;transform:translateX(-50%)}
      .dot.d5{left:6%;bottom:30%}
      .dot.d6{left:6%;top:30%}
      .dots .dot{animation:dot-orbit 2.8s ease-in-out infinite}
      .dots .dot.d1{animation-delay:0s}
      .dots .dot.d2{animation-delay:.15s}
      .dots .dot.d3{animation-delay:.3s}
      .dots .dot.d4{animation-delay:.45s}
      .dots .dot.d5{animation-delay:.6s}
      .dots .dot.d6{animation-delay:.75s}

      /* Shimmer sweep */
      .sweep{position:absolute;inset:0;border-radius:9999px;z-index:4;mix-blend-mode:screen;pointer-events:none;background:linear-gradient(110deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.12) 48%, rgba(255,255,255,0) 100%);transform:translateX(-180%);animation:sweep 2.8s ease-in-out infinite}

      .loader-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:-6px}

      /* Hide state */
      #loading-screen.loaded{opacity:0;transform:translateY(-12px);pointer-events:none}
      #loading-screen.loaded .logo-circle{transform:scale(.94);opacity:.92}

      @keyframes halo-rotate{0%{transform:rotate(0deg) scale(.98)}100%{transform:rotate(360deg) scale(.98)}}
      @keyframes logo-float{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
      @keyframes dot-orbit{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(.92)}100%{transform:translateY(0) scale(1)}}
